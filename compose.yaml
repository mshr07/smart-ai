services:
  api:
    build: .
    image: smartdesk-ai:local
    ports:
      - "8000:8000"
    volumes:
      - ticket_data:/app/runtime
    environment:
      DB_PATH: /app/runtime/tickets.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  ticket_data:
